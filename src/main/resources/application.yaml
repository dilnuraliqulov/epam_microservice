spring:
  application:
    name: training-workload

  # ActiveMQ Configuration
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: true

  # JMS Configuration
  jms:
    listener:
      acknowledge-mode: auto
      concurrency: 1-3

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:workloaddb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration - Can be overridden by environment variables JWT_SECRET and JWT_EXPIRATION
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenAuthenticationThatIsAtLeast256BitsLong12345}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Workload Queue Configuration
workload:
  queue:
    name: ${WORKLOAD_QUEUE_NAME:workload.queue}
    dlq-name: ${WORKLOAD_DLQ_NAME:workload.dlq}

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

logging:
  level:
    root: INFO
    com.example.workload: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] [%thread] %-5level %logger{36} - %msg%n"
