
services:
  # Training Workload Microservice
  training-workload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: training-workload
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://host.docker.internal:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-mySecretKeyForJWTTokenAuthenticationThatIsAtLeast256BitsLong12345}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
    gym-network:
        external: true

volumes:
  app-logs:

